<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Batalla Naval Online</title>
<style>
:root{--ink:#0b1b2b;--acc:#ffcf33;--ok:#3ddc84;--bad:#ff4d4f;--c:#2fb6ff;--mut:#cfe8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;color:#fff;font-family:'Fredoka',system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;touch-action:manipulation;overflow-x:hidden;
  background:linear-gradient(180deg,#5cc8fa 0,#2b92da 26%,#0f4c8a 58%,#082b52 100%) fixed}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;width:120px;height:34px;background:#fff;border-radius:50px;opacity:.8;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:54px;height:54px;left:16px;top:-26px}.cloud:after{width:70px;height:70px;left:52px;top:-38px}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(calc(100vw + 220px))}}
.waveWrap{position:absolute;left:0;right:0;bottom:0;height:90px;opacity:.45}
.waveWrap svg{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:wave 9s linear infinite}
.waveWrap svg:nth-child(2){animation-duration:6s;animation-direction:reverse;opacity:.6;bottom:-12px}
@keyframes wave{to{transform:translateX(-50%)}}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--ink);border-bottom:4px solid var(--acc);position:sticky;top:0;z-index:20}
h1{font-family:'Bangers',Impact,sans-serif;font-size:1.7rem;margin:0;letter-spacing:.1em;font-weight:400;color:var(--acc);text-shadow:2px 2px 0 #e8590c}
.hbtns{display:flex;gap:6px;align-items:center}
#voiceInd{font-size:.8rem;color:var(--ok);font-weight:700;animation:blink 1s infinite}@keyframes blink{50%{opacity:.4}}
main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:12px}
.card{background:linear-gradient(180deg,#2a78bd,#1b5d9b);border:4px solid var(--ink);border-radius:22px;padding:14px;margin:0 auto 12px;box-shadow:0 7px 0 var(--ink)}
.screen.card{max-width:560px}
.hidden{display:none!important}.row{display:flex;gap:8px;align-items:center;margin:6px 0}.wrap{flex-wrap:wrap}.bar{display:flex;justify-content:space-between;align-items:center}
input,select{padding:12px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:1rem;width:100%;margin:4px 0;outline:none}
input:focus,select:focus{box-shadow:0 0 0 4px #ffcf3388}select{width:auto}
button{padding:10px 14px;border:3px solid var(--ink);border-radius:14px;background:#3aa0ff;color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 #0007;transition:transform .08s,box-shadow .08s,filter .15s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.big{width:100%;padding:14px;font-size:1.15rem;margin:6px 0 8px;letter-spacing:.03em}
button.alt{background:var(--ok);color:var(--ink);text-shadow:none}button.sm{padding:5px 10px;font-size:.9rem;width:auto;box-shadow:0 3px 0 var(--ink)}
button.on{background:var(--acc);color:var(--ink);text-shadow:none}button:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.5);transform:none}
#mic.live{background:var(--bad);animation:micp 1s infinite}@keyframes micp{50%{box-shadow:0 5px 0 var(--ink),0 0 0 6px #ff4d4f66}}
#mic.talk{background:#ff8a3d}
canvas{display:block;margin:0 auto;border-radius:14px;touch-action:none;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
#code{font-family:'Bangers',Impact,sans-serif;font-size:3.2rem;letter-spacing:.3em;font-weight:400;text-align:center;color:var(--acc);text-shadow:3px 3px 0 var(--ink)}
.muted{color:var(--mut);font-size:.85rem}.timer{font-family:'Bangers',Impact,sans-serif;font-size:1.6rem;color:var(--acc);text-shadow:2px 2px 0 var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.prow{display:flex;gap:8px;align-items:center;padding:8px 0;flex-wrap:wrap;border-bottom:3px dashed #0b1b2b44}.sw{width:24px;height:24px;border-radius:50%;padding:0;box-shadow:0 2px 0 var(--ink)}
.homeLogo{text-align:center;margin-bottom:6px}.homeLogo .big{font-size:3.6rem;display:inline-block;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 0 var(--ink))}
.homeLogo h2{margin:0;font-family:'Bangers',Impact,sans-serif;letter-spacing:.14em;font-size:2.4rem;font-weight:400;color:var(--acc);text-shadow:3px 3px 0 var(--ink)}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
hr{border:0;border-top:3px dashed #0b1b2b55;margin:12px 0}

.crest{flex:none;filter:drop-shadow(0 3px 0 #0b1b2b)}
.profile{display:flex;align-items:center;gap:10px;width:100%;min-width:0}
.pinfo{flex:1;min-width:0}.pn{font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #0b1b2b88}.pn small{color:var(--mut);font-weight:500}.pn .bad{color:#ffb3b3}
.pm{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0}.chip{background:#0b1b2b66;border-radius:20px;padding:1px 9px;font-size:.7rem;color:#fff;white-space:nowrap}
.pips{display:flex;gap:3px;flex-wrap:wrap}.pip{width:16px;height:8px;border-radius:4px;background:var(--ok);border:2px solid var(--ink);transition:background .4s}.pip.dead{background:#55313a}
.pst{display:flex;gap:10px;text-align:center;flex:none}.pst b{display:block;font-size:1.15rem}.pst span{font-size:.6rem;color:var(--mut);text-transform:uppercase}

#battle{max-width:1200px;margin:0 auto}
#arena{display:grid;grid-template-columns:1fr 136px 1fr;gap:8px;align-items:stretch}
.half{position:relative;border:4px solid var(--ink);border-radius:24px;padding:30px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;box-shadow:0 7px 0 var(--ink);transition:box-shadow .3s}
.half.enemy{background:linear-gradient(160deg,#c2485f,#6d2a63)}
.half.me{background:linear-gradient(160deg,#2f9fe6,#1d5fa8)}
.half.active{box-shadow:0 7px 0 var(--ink),0 0 0 5px var(--c),0 0 36px 4px var(--c);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 7px 0 var(--ink),0 0 0 5px var(--c),0 0 54px 10px var(--c)}}
.half.active .crest{animation:hop 1.1s ease-in-out infinite}@keyframes hop{40%{transform:translateY(-6px) rotate(-5deg)}}
.half.speak .crest{animation:talk .45s infinite;filter:drop-shadow(0 0 10px #fff)}@keyframes talk{50%{transform:scale(1.2) rotate(-6deg)}}
.half.shake{animation:shake .45s}@keyframes shake{20%{transform:translate(-6px,3px) rotate(-.6deg)}40%{transform:translate(6px,-3px) rotate(.6deg)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.tag{position:absolute;top:-2px;left:50%;transform:translateX(-50%);padding:2px 18px;border:4px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;font-family:'Bangers',Impact,sans-serif;font-size:1rem;letter-spacing:.14em;color:#fff;text-shadow:1px 1px 0 var(--ink)}
.enemy .tag{background:#e0332e}.me .tag{background:#18a86b}
#enemies{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0}
#tri{position:relative;width:114px;height:114px;flex:none;animation:tp 1.2s ease-in-out infinite}@keyframes tp{50%{transform:scale(1.07)}}
#tri svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .45s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 5px 0 var(--ink)) drop-shadow(0 0 14px var(--c))}
#tri polygon{fill:var(--c);stroke:var(--ink);stroke-width:6;stroke-linejoin:round;transition:fill .3s}
#btimer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bangers',Impact,sans-serif;font-size:2rem;font-weight:400;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);transition:transform .45s;letter-spacing:.04em}
#mid[data-dir=enemy] #tri svg{transform:scaleX(-1)}
#mid[data-dir=me] #btimer{transform:translateX(-13%)}#mid[data-dir=enemy] #btimer{transform:translateX(13%)}
#mid.low polygon{fill:var(--bad)}#mid.low #tri{animation:shk .35s infinite}@keyframes shk{25%{transform:scale(1.1) rotate(-3deg)}75%{transform:scale(.95) rotate(3deg)}}
#turnLabel{font-family:'Bangers',Impact,sans-serif;letter-spacing:.06em;font-size:1.1rem;text-align:center;line-height:1.1;max-width:132px;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 var(--ink)}
#fire{width:132px;padding:12px 6px;font-size:1rem;background:var(--bad)}
#fire:disabled{background:#6f8397;animation:none}
#fire:not(:disabled){animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
#log{width:100%;height:50px;overflow:hidden;font-size:.82rem;background:var(--ink);border-radius:14px;padding:6px 12px;margin-top:10px;color:#cfe8ff}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#log div:first-child{color:#fff;font-weight:700}
#chatbox{position:fixed;right:10px;bottom:10px;width:min(340px,94vw);z-index:30;margin:0}
#chatlog{height:110px;overflow-y:auto;font-size:.85rem;background:#0b1b2b55;border-radius:10px;padding:6px}
#unread{background:var(--bad);border-radius:10px;padding:0 6px;font-size:.7rem;margin-left:4px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);border:3px solid var(--acc);padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;z-index:50;font-weight:700}#toast.show{opacity:1}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:2px solid #0b1b2b55;text-align:center;font-size:.85rem}
#endTitle{text-align:center;font-family:'Bangers',Impact,sans-serif;letter-spacing:.08em;font-size:3rem;margin:4px 0 10px;font-weight:400;text-shadow:3px 3px 0 var(--ink);animation:bob 1.6s ease-in-out infinite}
.conf{position:fixed;top:-40px;font-size:1.7rem;animation:fall 3.2s linear forwards;z-index:60;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}

@media (orientation:portrait){
  #arena{grid-template-columns:1fr}
  #mid{flex-direction:row;gap:14px}
  #tri{width:92px;height:92px}
  #mid[data-dir=me] #tri svg{transform:rotate(90deg)}#mid[data-dir=enemy] #tri svg{transform:rotate(-90deg)}
  #mid[data-dir=me] #btimer{transform:translateY(-13%)}#mid[data-dir=enemy] #btimer{transform:translateY(13%)}
  #fire{width:auto;flex:1;max-width:190px}
  .pst{display:none}
}
@media (max-height:440px) and (orientation:landscape){
  header{padding:3px 10px}h1{font-size:1.3rem}main{padding:6px}
  .pm,.pips,.pst span{display:none}.half{padding-top:24px;gap:4px}
  #tri{width:88px;height:88px}#btimer{font-size:1.5rem}#log{height:30px;margin-top:4px}#arena{grid-template-columns:1fr 112px 1fr}#fire{width:108px}
}

/* ===== ajustes: tablero grande, perfiles compactos, cómodo en móvil ===== */
header button{min-height:38px}main{padding:8px}
.half{padding:26px 8px 8px;gap:6px}.tag{font-size:.9rem;padding:1px 14px}
.profile{gap:8px}.pn{font-size:1rem}.pm,.pst{display:none}.pip{width:12px;height:7px}
#arena{grid-template-columns:1fr 116px 1fr;gap:6px}
#tri{width:88px;height:88px}#btimer{font-size:1.7rem}#fire{width:112px;font-size:.9rem;padding:10px 4px}#turnLabel{max-width:112px;font-size:1rem}
@media (min-width:900px) and (min-height:640px){.pm,.pst{display:flex}.half{padding-top:30px}#arena{grid-template-columns:1fr 136px 1fr}#tri{width:114px;height:114px}#btimer{font-size:2rem}#fire{width:132px;font-size:1rem}#turnLabel{max-width:132px}}
@media (orientation:portrait){
  main{padding:6px}#arena{grid-template-columns:1fr;gap:10px}
  #mid{position:sticky;top:62px;z-index:15;flex-direction:row;gap:10px;padding:6px 12px;background:#0b1b2bee;border:3px solid var(--acc);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
  #tri{width:58px;height:58px}#btimer{font-size:1.25rem}
  #fire{width:auto;flex:1;max-width:none;padding:12px 8px;font-size:1.05rem}
  #turnLabel{max-width:110px;font-size:.95rem}.half{padding:26px 6px 8px}
}

#log:empty,#enemies:empty{display:none}
@media (max-width:600px){h1{font-size:1.25rem;white-space:nowrap}header{padding:6px 10px}.hbtns{gap:4px}}
@media (orientation:portrait){#mid{top:52px}}
@media (max-height:500px) and (orientation:landscape){
  header{padding:3px 10px}header button{min-height:32px;padding:3px 10px}h1{font-size:1.1rem}main{padding:5px 8px}
  #log{display:none}
  #arena{grid-template-columns:1fr 96px 1fr;gap:4px}
  .half{flex-direction:row;align-items:flex-start;justify-content:center;padding:22px 6px 6px;gap:6px}
  .tag{font-size:.8rem;padding:0 12px}
  .profile{flex-direction:column;width:62px;flex:none;gap:4px;text-align:center}
  .pinfo{width:100%}.pn{font-size:.78rem}.pn small,.pn .bad{display:none}.pips{justify-content:center;gap:2px}.pip{width:9px;height:6px}
  #tri{width:72px;height:72px}#btimer{font-size:1.3rem}#fire{width:92px;font-size:.78rem;padding:8px 2px}#turnLabel{max-width:96px;font-size:.85rem}
}
@media (max-width:430px){h1{font-size:1rem;letter-spacing:.03em}header{padding:5px 8px}header button.sm{padding:3px 8px;min-width:34px}#voiceInd{display:none}}
</style></head><body>
<div id="bg"></div>
<header><h1>⚓ BATALLA NAVAL</h1><div class="hbtns"><span id="voiceInd"></span><button id="mic" class="sm hidden" title="Activar/desactivar micrófono">🎙️</button><button id="chatBtn" class="sm hidden">💬<span id="unread" class="hidden"></span></button><button id="mute" class="sm">🔊</button> <button id="leave" class="sm hidden">Salir</button></div></header>

  <div class="row"><select id="scope"><option value="room">Sala</option><option value="team">Equipo</option></select><input id="chatIn" placeholder="Mensaje…" maxlength="200"><button id="send" class="sm">➤</button></div></div>

<script>
// Carga PeerJS desde CDN (con respaldo)
window.__peerReady = new Promise(res => {
  const urls = ['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
  (function next(i) { if (i >= urls.length) return res(false); const s = document.createElement('script'); s.src = urls[i]; s.onload = () => res(true); s.onerror = () => next(i + 1); document.head.appendChild(s); })(0);
});
</script>
<script>
// ===== CONFIG + REGLAS =====
const C = {
  BOARD_SIZE: 12, BOARD_SIZES: [10, 12, 15],
  PLACEMENT_SECONDS: 90, TURN_SECONDS: 30, RECONNECT_SECONDS: 60, MAX_REPEAT_ON_HIT: 1,
  FLEET: [
    { type: 'carrier', name: 'Portaaviones', size: 5, count: 1 },
    { type: 'battleship', name: 'Acorazado', size: 4, count: 1 },
    { type: 'cruiser', name: 'Crucero', size: 3, count: 2 },
    { type: 'destroyer', name: 'Destructor', size: 2, count: 2 },
    { type: 'submarine', name: 'Submarino', size: 3, count: 1 },
    { type: 'heliship', name: 'Buque de helicópteros', size: 3, count: 1 }
  ],
  MODES: { '1v1': { perTeam: 1 }, '2v2': { perTeam: 2 }, '4v4': { perTeam: 4 } },
  COLORS: ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#ff6fa5']
};
const R = (() => {
  const fleetList = () => { const l = []; C.FLEET.forEach(f => { for (let i = 0; i < f.count; i++) l.push({ type: f.type, size: f.size }); }); return l; };
  const cellsOf = s => { const c = []; for (let i = 0; i < s.size; i++) c.push({ x: s.x + (s.h ? i : 0), y: s.y + (s.h ? 0 : i) }); return c; };
  function validate(ships, size) {
    if (!Array.isArray(ships)) return 'Flota inválida';
    const need = fleetList().map(f => f.type).sort().join();
    if (ships.map(s => s && s.type).sort().join() !== need) return 'Flota inválida';
    const occ = new Set();
    for (const s of ships) {
      const def = C.FLEET.find(f => f.type === s.type);
      if (!Number.isInteger(s.x) || !Number.isInteger(s.y)) return 'Coordenadas inválidas';
      for (const c of cellsOf({ size: def.size, x: s.x, y: s.y, h: !!s.h })) {
        if (c.x < 0 || c.y < 0 || c.x >= size || c.y >= size) return 'Barco fuera del mapa';
        const k = c.x + ',' + c.y; if (occ.has(k)) return 'Barcos superpuestos'; occ.add(k);
      }
    }
    return null;
  }
  function randomFleet(size) {
    for (let a = 0; a < 200; a++) {
      const occ = new Set(), out = []; let ok = true;
      for (const f of fleetList().sort((p, q) => q.size - p.size)) {
        let placed = false;
        for (let i = 0; i < 200 && !placed; i++) {
          const h = Math.random() < 0.5;
          const x = Math.floor(Math.random() * (size - (h ? f.size : 1) + 1));
          const y = Math.floor(Math.random() * (size - (h ? 1 : f.size) + 1));
          const cs = cellsOf({ size: f.size, x, y, h });
          if (cs.every(c => !occ.has(c.x + ',' + c.y))) { cs.forEach(c => occ.add(c.x + ',' + c.y)); out.push({ type: f.type, x, y, h }); placed = true; }
        }
        if (!placed) { ok = false; break; }
      }
      if (ok) return out;
    }
    return [];
  }
  return { fleetList, cellsOf, validate, randomFleet };
})();

// ===== SERVIDOR (corre en el navegador del anfitrión) =====
const rooms = new Map(), clients = new Map();
const clean = s => String(s || '').replace(/[<>&"']/g, '').trim().slice(0, 16);
const plist = r => [...r.players.values()];
const teamPlayers = (r, t) => plist(r).filter(p => p.team === t);

function add(o) { if (E.length < 500) E.push(o); }

  if (res === 'water') {

    add({ id, t0: t, k: 'ring', dur: 700, x: cx, y: cy, r0: cs * .1, r1: cs * .95, col: '255,255,255', lw: 4 }); add({ id, t0: t + 150, k: 'ring', dur: 800, x: cx, y: cy, r0: cs * .1, r1: cs * 1.2, col: '200,240,255', lw: 3 });
    for (let i = 0; i < 16; i++) add({ id, t0: t, k: 'part', dur: rnd(650, 1000), x: cx, y: cy, vx: rnd(-1.6, 1.6) * cs, vy: -cs * rnd(2, 4), g: cs * 9, r: cs * rnd(.05, .1), col: '#eafaff' });
    add({ id, t0: t, k: 'text', dur: 900, x: cx, y: cy - cs * .3, txt: '¡PLOF!', col: '#d6f5ff', sz: Math.max(14, cs * .55) });

    if (sunk) add({ id, t0: t + 120, k: 'ring', dur: 800, x: cx, y: cy, r0: cs * .2, r1: cs * 2.6, col: '255,255,255', lw: 4 });
    for (let i = 0; i < (sunk ? 40 : 24); i++) add({ id, t0: t, k: 'part', dur: rnd(500, 1100), x: cx, y: cy, vx: rnd(-3, 3) * cs, vy: rnd(-3.5, 1) * cs, g: cs * 6, r: cs * rnd(.04, .09), col: Math.random() < .5 ? '#ff9f1a' : '#ffe066' });
    for (let i = 0; i < (sunk ? 16 : 9); i++) add({ id, t0: t + rnd(0, 300), k: 'smoke', dur: rnd(1400, 2400), x: cx + rnd(-cs * .3, cs * .3), y: cy, vx: rnd(-.5, .5) * cs, vy: -cs * rnd(.5, 1.1), r0: cs * .15, r1: cs * rnd(.5, .9), col: i % 2 ? '70,75,85' : '110,115,125' });
    add({ id, t0: t, k: 'text', dur: 1000, x: cx, y: cy - cs * .3, txt: sunk ? '¡HUNDIDO!' : '¡BOOM!', col: sunk ? '#ff6b5b' : '#ffd23f', sz: Math.max(16, cs * (sunk ? .7 : .62)) });

}
function loop(t) {

    drawBoard($('pc'), t, { ships: myShips, editing: true, ghost });
  }
  if (S && S.phase === 'playing') {
    const tp = S.players.find(p => p.pid === target), me = meP(), px = battlePx();
    if (tp && fit($('ec'), px)) drawBoard($('ec'), t, { shots: tp.shots, sunk: tp.sunkShips, sel });
    if (me && fit($('oc'), px)) drawBoard($('oc'), t, { ships: me.ships, shots: me.shots, bob: true });

}
requestAnimationFrame(loop);

// colocación
const cellAt = (cv, e) => { const r = cv.getBoundingClientRect(), k = cv.width / DPR / r.width, G = geo(cv); return { x: Math.floor(((e.clientX - r.left) * k - G.m) / G.cs), y: Math.floor(((e.clientY - r.top) * k - G.m) / G.cs) }; };

  return R.cellsOf(s).every(c => c.x >= 0 && c.y >= 0 && c.x < S.size && c.y < S.size && !occ.has(c.x + ',' + c.y));

  const opts = [Object.assign({}, s, { h }), Object.assign({}, s, { h, x: Math.min(s.x, S.size - (h ? s.size : 1)), y: Math.min(s.y, S.size - (h ? 1 : s.size)) })];

const pc = $('pc');
pc.onpointerdown = e => {

// batalla

  for (let i = 0; i < total; i++) pips += '<i class="pip' + (i < p.left ? '' : ' dead') + '"></i>';
  return crest(p.color, p.name, 34) + '<div class="pinfo"><div class="pn">' + p.name + (isMe ? ' <small>(tú)</small>' : '') + (p.pid === S.host ? ' 👑' : '') + (p.connected ? '' : ' <small class="bad">⚠ desconectado</small>') +
    '</div><div class="pm"><span class="chip">Equipo ' + p.team + '</span><span class="chip">🗺 Mapa ' + S.size + '×' + S.size + '</span></div><div class="pips">' + pips + '</div></div>' +
    '<div class="pst"><div><b>' + p.left + '</b><span>barcos</span></div><div><b>' + acc + '%</b><span>precisión</span></div><div><b>' + p.stats.sunk + '</b><span>hundidos</span></div></div>';
}

  $('enemies').innerHTML = enemies.length > 1 ? enemies.map(p => '<button class="sm ' + (p.pid === target ? 'on' : '') + '" onclick="pick(\'' + p.pid + '\')">' + p.name + (p.alive ? '' : ' ☠') + '</button>').join('') : '';
  $('halfM').classList.toggle('active', mine); $('halfE').classList.toggle('active', !mine);

  $('turnLabel').textContent = !me.alive ? '☠ Eliminado' : mine ? '¡TU TURNO!' : 'Turno de ' + turnP.name;

let selDrag = false;
function pickCell(e) {
